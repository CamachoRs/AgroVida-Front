<app-nav-component [activeLink]="activeLink" />
<div class="px-sm-5">
    <h2 class="fw-bold mt-4">Categorias</h2>
    <p class="mb-4">
    <p class="mb-4">Aquí puedes administrar los productos, medicamentos, alimentos e insumos de tu finca.</p>
    <nav class="d-none d-md-flex my-3">
        <div class="nav nav-underline" id="nav-tab" role="tablist">
            <button class="nav-link active color-1" id="nav-list-tab" data-bs-toggle="tab" data-bs-target="#nav-list"
                type="button" role="tab" aria-controls="nav-list" aria-selected="true"
                (click)="activateTabItem('nav-list-tab', null)">
                Listado de Categorias
            </button>
            <button class="nav-link color-1" id="nav-manage-tab" data-bs-toggle="tab" data-bs-target="#nav-manage"
                type="button" role="tab" aria-controls="nav-manage" aria-selected="false">
                Detalle de Categorias
            </button>
        </div>
    </nav>
    <div class="tab-content" id="nav-tabContent">
        <div class="tab-pane fade show active" id="nav-list" role="tabpanel" aria-labelledby="nav-list-tab"
            tabindex="0">
            <button class="btn bg-color-1 rounded-5 d-sm-none fw-bold w-100"
                (click)="activateTabItem('nav-manage-tab', null)">
                <i class="fa-solid fa-plus"></i>
                Agregar Categoría
            </button>
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Nombre de la categoría</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Tipo de categoría</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for(item of categoryItems; track item.id){
                        <tr>
                            <th class="fw-normal">{{item.name}}</th>
                            <td class="text-truncate" style="max-width: 150px;">{{item.description}}</td>
                            <td>{{item.source}}</td>
                            <td>
                                <button class="btn bg-color-1 rounded-5 fw-bold"
                                    (click)="activateTabItem('nav-manage-tab', item)">
                                    Detalle
                                </button>
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
                <p class="text-center color-1">
                    Has llegado al final de las categorias
                </p>
            </div>
        </div>
        <div class="tab-pane fade" id="nav-manage" role="tabpanel" aria-labelledby="nav-manage-tab" tabindex="0">
            <form #formulario="ngForm" class="row">
                <div class="col col-12 col-md-6">
                    <div class="mb-3">
                        <label for="formGroupExampleInput1" class="form-label">Nombre:</label>
                        <input type="text" class="form-control color-1" id="formGroupExampleInput1"
                            placeholder="Ingresa el nombre de la cateogría" name="name" [(ngModel)]="name" />
                    </div>
                    <div class="mb-3">
                        <label for="formGroupExampleInput3" class="form-label">Tipo de categoría:</label>
                        <select class="form-select color-1" aria-label="Default select example"
                            id="formGroupExampleInput3" name="source" [(ngModel)]="source"
                            [attr.disabled]="source ? true : null">
                            <option value="" selected disabled>Selecciona el tipo de categoría</option>
                            <option value="producto">Producto</option>
                            <option value="animal">Animal</option>
                        </select>
                    </div>
                </div>
                <div class="col col-12 col-md-6">
                    <div class="mb-3">
                        <label for="formGroupExampleInput2" class="form-label">Descripción:</label>
                        <textarea class="form-control" id="formGroupExampleInput2"
                            placeholder="Ingresa alguna Descripción de la categoría" name="description"
                            [(ngModel)]="description"></textarea>
                    </div>
                </div>
                <div class="d-flex flex-column gap-2 justify-content-center align-items-center">
                    <input type="submit" class="w-50 btn bg-color-1 rounded-5 fw-bold" value="Nueva categoría"
                        (click)="postCategories(formulario)">
                    <input type="submit" class="w-50 btn bg-color-5 rounded-5 fw-bold" value="Guardar cambios"
                        (click)="putCategories(formulario)">
                    <input type="submit" class="w-50 btn rounded-5 fw-bold" value="Eliminar cateogría"
                        (click)="deleteCategories(formulario)">
                    <button class="btn rounded-5 d-sm-none" (click)="activateTabItem('nav-list-tab', null)">
                        <i class="fa-solid fa-arrow-left"></i>
                        Volver al listado de productos
                    </button>
                </div>

        </div>
    </div>
